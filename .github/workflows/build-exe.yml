name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets & Windows EXE
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goPanda-Setup
          path: dist-electron/goPanda-Setup.exe
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: goPanda Windows Desktop Release
          body: |
            ## 🎋 goPanda Windows Desktop App (.exe)
            - **Borderless Floating Panda Circle**: Stays floating cleanly on top of YouTube, Brave, Discord, VS Code & games.
            - **Full Study Studio**: Expand to full 3-column workspace at any time.
          files: dist-electron/goPanda-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

