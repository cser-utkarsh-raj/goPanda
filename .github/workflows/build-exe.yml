name: Build Lightweight Desktop Apps (Windows, Mac, Linux)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
          - platform: 'macos-latest'
            name: 'macos'
          - platform: 'ubuntu-22.04'
            name: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev javascriptcoregtk-4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Desktop Apps (~5MB)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: 'goPanda Lightweight Desktop Release (~5MB)'
          releaseBody: |
            ## 🎋 goPanda Ultra-Lightweight Desktop Apps (~5 MB)
            - **Windows**: `goPanda-Setup.exe` (NSIS Installer)
            - **macOS**: `goPanda.dmg`
            - **Linux**: `goPanda.AppImage` / `.deb`
            - **Performance**: Native system WebView engine, <25MB RAM, instant launch!
            - **Overlay**: Stays on top of YouTube, Brave, games & coding editors.
          releaseDraft: false
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goPanda-${{ matrix.name }}-binaries
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30
