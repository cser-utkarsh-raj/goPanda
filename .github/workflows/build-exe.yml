name: Build Lightweight Desktop Apps (Windows, Mac, Linux)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
          - platform: 'macos-latest'
            name: 'macos'
          - platform: 'ubuntu-22.04'
            name: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev javascriptcoregtk-4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Desktop Apps
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: 'goPanda Native Desktop Release'
          releaseBody: |
            ## 🎋 goPanda Native Desktop Apps
            - **Windows**: `goPanda-Setup.exe` (NSIS Installer)
            - **macOS**: `goPanda.dmg` (Universal Disk Image)
            - **Linux**: `goPanda.AppImage` & `goPanda.deb`
            - **Performance**: Native system WebView engine with minimal memory footprint and instant launch!
            - **Overlay**: Floating circle stays on top of YouTube, PDF readers, and code editors.
          releaseDraft: false
          prerelease: false

      - name: Prepare Clean Release Aliases
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            find src-tauri/target/release/bundle/nsis -type f -name "*.exe" -exec cp {} release-assets/goPanda-Setup.exe \; 2>/dev/null || true
            find src-tauri/target/release/bundle/nsis -type f -name "*.exe" -exec cp {} release-assets/ \; 2>/dev/null || true
            find src-tauri/target/release/bundle/msi -type f -name "*.msi" -exec cp {} release-assets/ \; 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            find src-tauri/target/release/bundle/dmg -type f -name "*.dmg" -exec cp {} release-assets/goPanda.dmg \; 2>/dev/null || true
            find src-tauri/target/release/bundle/dmg -type f -name "*.dmg" -exec cp {} release-assets/ \; 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" -exec cp {} release-assets/goPanda.AppImage \; 2>/dev/null || true
            find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" -exec cp {} release-assets/ \; 2>/dev/null || true
            find src-tauri/target/release/bundle/deb -type f -name "*.deb" -exec cp {} release-assets/goPanda.deb \; 2>/dev/null || true
            find src-tauri/target/release/bundle/deb -type f -name "*.deb" -exec cp {} release-assets/ \; 2>/dev/null || true
          fi
          ls -la release-assets

      - name: Publish & Overwrite Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload latest release-assets/* --clobber --repo ${{ github.repository }} || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goPanda-${{ matrix.name }}-binaries
          path: |
            release-assets/*
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30
