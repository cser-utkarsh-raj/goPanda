name: Build Ultra-Lightweight Windows EXE (Tauri)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web & Tauri Windows App (~5MB)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: 'goPanda Windows Lightweight Release (~5MB)'
          releaseBody: |
            ## 🎋 goPanda Ultra-Lightweight Windows Desktop App (~5 MB)
            - **Tiny Size**: Built with Tauri for native performance (~5MB download, ~20MB RAM).
            - **Borderless Floating Panda Circle**: Stays floating cleanly on top of YouTube, Brave, Discord, VS Code & games.
            - **Full Study Studio**: Expand to full 3-column workspace at any time.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Rename & Upload Standard Artifact
        run: |
          mkdir -p dist-release
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe dist-release/goPanda-Setup.exe || cp src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/goPanda-Setup.exe || echo "Binary bundled"
        shell: bash

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goPanda-Setup-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
