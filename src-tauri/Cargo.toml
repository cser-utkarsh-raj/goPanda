[package]
name = "gopanda"
version = "1.0.0"
description = "goPanda - Lightweight Cute Floating Pomodoro Timer and Productivity Companion"
authors = ["Utkarsh Raj"]
edition = "2021"

[lib]
name = "gopanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
